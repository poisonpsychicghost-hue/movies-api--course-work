<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My First Page</title>
<style>
  body{margin:0;font:16px/1.6 system-ui,-apple-system,sans-serif;color:#1a1a1a;background:#f6f7fb}
  main{max-width:640px;margin:0 auto;padding:40px 24px}
  h1{margin:0 0 8px}
  .tag{color:#6b7280}
  hr{border:0;border-top:1px solid #e5e7eb;margin:24px 0}
  ul{padding-left:20px}
  a{color:#2563eb}
</style>
</head>
<body>
  <main>
    <h1>Hello from Flask</h1>
    <p class="tag">This page is served by your own web server.</p>
    <hr>
    <h2>A few HTML elements</h2>
    <p>This is a paragraph of text inside a static HTML page.</p>
    <ul>
      <li>An item in a list</li>
      <li>Another item</li>
      <li>One more item</li>
    </ul>
    <p>Here is a <a href="https://developer.mozilla.org/en-US/docs/Web/HTML">link about HTML</a>.</p>
  </main>
</body>
</html>
